# Manifest for the curated canonical research layer.
# Mirrors the Research Workstreams database in Notion for tooling; Notion is the
# pipeline of record. See README.md for the raw-versus-canonical split.

version: "1.0"
updated: "2026-08-02"
governing_spec: "Notion, Content Evidence & Production System"
publication_standard: "research/evidence-policy.md"

layers:
  raw:
    path: "data/evidence/"
    description: >-
      The Perplexity research package exactly as imported on 2026-07-31.
      Preserved unmodified for provenance. Never edited to match a publication
      decision.
    files:
      - claim_cards.md
      - evidence_ledger.csv
      - executive_brief.md
      - industry_packs.md
      - cross_industry_synthesis.md
      - priority_claims_list.md
  canonical:
    path: "research/"
    description: >-
      The curated layer publication draws from. Where the layers disagree, this
      one is the working authority for what may be published.

present:
  - file: evidence-policy.md
    status: current
    description: Two-tier publication standard, Approved versus Verified.
  - file: source-bibliography.md
    status: current
    description: All 30 sources grouped by tier, with claims and limits.
    generated_from: data/evidence/evidence_ledger.csv
  - file: evidence-gaps.md
    status: current
    description: Ten open gaps, stated rather than filled.
  - file: README.md
    status: current
  - file: manifest.yaml
    status: current
  - file: evidence-ledger.csv
    status: current
    description: >-
      All 43 claims with validated statuses from the WS-19 pass, 2026-08-02.
      Carries both Import Status (as delivered by the research tool) and
      Validated Status (after a validator consulted the original source), so
      every change is auditable. Status column reflects the validated value.
    validation_summary:
      approved: 24
      verified: 11
      candidate: 5
      rejected: 3
      upgrades_from_import: 9
      downgrades_from_import: 7
    notable_downgrades: >-
      U-AI-003 and U-AI-004 (Dell'Acqua) fell from approved to verified because
      the source could not be reached at an authoritative location, so their
      figures may no longer be published as exact assertions. U-AI-005
      (Brynjolfsson) and CONS-001 fell to candidate. U-KNOW-001 and U-MEAS-001
      fell to verified; U-MEAS-001 was additionally found to misstate the
      Deloitte finding by converting a respondent expectation into an observed
      outcome.

pending:
  # Not created as stubs on purpose: a placeholder that looks like an evidence
  # pack is the unimplemented-specification trap. Each entry names its workstream.
  - file: claim-cards.md
    workstream: 19
    blocked_on: >-
      Curation from the raw claim cards, rewriting each card's publication
      language to match its validated tier. The raw cards at
      data/evidence/claim_cards.md still carry pre-validation language and
      must not be used verbatim for the downgraded claims.
  - file: universal-professional-services.md
    workstream: 1
    status: not_started
  - path: industries/
    workstreams: [2, 3, 4, 5, 6, 7, 8, 9]
    status: not_started
    note: >-
      The eight industry playbooks were built from the universal and industry
      material in the raw import, not from per-industry evidence packs.
  - path: workflows/
    workstreams: [10, 11, 12]
    status: not_started
    note: >-
      Proposal-to-Project, Knowledge-to-Delivery, Delivery-to-Executive Insight.
  - path: personas/
    workstreams: [13, 14, 15, 16, 17, 18]
    status: not_started

published_surfaces:
  # Every public asset bound by the evidence policy.
  outcome_layer:
    - outcomes.html
    - outcome-proposal-to-project.html
    - proposal-to-project-diagnostic.html
    - lp/proposal-to-project/index.html   # noindex, campaign traffic only
  hub_and_offer:
    - professional-services.html
    - workflow-leverage-assessment.html
  playbooks:
    - grow-delivery-capacity-with-governed-ai.html
    - governed-ai-for-it-consulting.html
    - governed-ai-for-accounting-cpa-firms.html
    - governed-ai-for-law-firms.html
    - governed-ai-for-architecture-engineering.html
    - governed-ai-for-executive-search.html
    - governed-ai-for-creative-agencies.html
    - governed-ai-for-managed-service-providers.html
  campaigns: "content/campaigns/*.md"
  persona_pages: "go/<industry>/<persona>/  # 48 pages, noindex, generated"
  business_play_cards: "content/business-plays/*.md"

business_plays:
  # Canonical records live in Notion; these are the build-side references.
  - name: Proposal-to-Project Accelerator
    outcome: Shorten the Path from Proposal to Project
    stage: Defined
    commercial: active
    card: content/business-plays/proposal-to-project.md
  - name: Knowledge-to-Delivery Accelerator
    outcome: Turn institutional knowledge into reusable client-ready delivery
    stage: Defined
    commercial: library
  - name: Delivery-to-Executive Insight Accelerator
    outcome: Give leaders trustworthy visibility into delivery, risk, and next actions
    stage: Hypothesis
    commercial: library
