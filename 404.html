<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found, Jimi Ige</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/assets/ds/styles.css">
<link rel="stylesheet" href="/assets/ds/site.css">
<script src="/assets/ds/ds.js" defer></script>
<style>
  /* A short document still reads as a document: the sheet fills the viewport so
     the margin rail has something to run down. */
  .doc { min-height: 100vh; display: flex; flex-direction: column; }
  .doc > main { flex: 1; display: flex; }
  .band--404 { display: flex; align-items: center; width: 100%; }
  /* the inner column is a flex item, so it needs min-width:0 or it sizes to
     its widest child (the 386px copper rule) and pushes the page sideways */
  .band--404 > .band-inner { flex: 1; min-width: 0; }
  .band--404 .hero-rule { max-width: 100%; }
</style>
</head>
<body>

<div class="doc">
  <main>

    <div class="rail" aria-hidden="true">
      <div class="rail-nums"></div>
      <span class="rail-rule rail-rule--a"></span>
      <span class="rail-rule rail-rule--b"></span>
    </div>

    <section class="band band--flush band--404">
      <div class="band-inner">
        <span class="credstack-practice">404</span>
        <span class="hero-rule" style="position:static;width:386px;max-width:100%;"></span>
        <h1 class="display-2" style="max-width:20ch;">This page has moved on, or never existed.</h1>
        <p class="prose">The link may be old or mistyped. Head back to the start, or jump straight to the free tools.</p>
        <div class="row">
          <a class="btn btn--primary" href="/">Home</a>
          <a class="btn btn--secondary" href="/resources.html">Free tools</a>
        </div>
      </div>
    </section>

  </main>
</div>

</body></html>
