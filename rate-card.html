<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Confidential</title>
<link rel="stylesheet" href="/assets/ds/styles.css" />
<link rel="stylesheet" href="/assets/ds/site.css" />
<script src="/assets/ds/ds.js" defer></script>
<style>
  /* the sheet fills the viewport so the margin rail has a document to run down */
  .doc { min-height: 100vh; }

  /* Gate ------------------------------------------------------------------ */
  #gate { max-width: 420px; margin: 12vh auto 0; padding: 0 var(--space-4); }
  #gate .card-body { gap: var(--space-3); }
  #err { min-height: 18px; }
  #err:not(:empty) {
    font-family: var(--font-mono);
    font-size: var(--size-mono-sm);
    letter-spacing: 1px;
    color: var(--risk-high-text);
  }

  /* Rate card ------------------------------------------------------------- */
  /* The document below the gate is AES-encrypted in this page and injected as
     innerHTML after decryption, so its markup cannot be edited here — only its
     class names can be styled, and they must keep the names the ciphertext
     already uses. Element-level fallbacks below catch anything not classed. */
  #rc { display: none; max-width: 820px; }
  #rc-wrap { padding: var(--space-6) 4.92% var(--space-6) 7.07%; }

  .rc-eyebrow,
  .rc-h {
    display: block;
    font-family: var(--font-mono);
    font-size: var(--size-mono-xs);
    letter-spacing: var(--track-label);
    text-transform: uppercase;
    color: var(--copper-700);
    margin-bottom: var(--space-2);
  }

  .rc-title {
    font-family: var(--font-serif);
    font-weight: var(--weight-regular);
    font-size: var(--size-display-1);
    line-height: var(--lh-display);
    letter-spacing: var(--track-display);
    color: var(--text-display);
    margin: 0 0 var(--space-3);
  }

  .rc-lead {
    font-family: var(--font-mono);
    font-size: var(--size-prose);
    line-height: var(--lh-prose);
    color: var(--text-body);
    max-width: var(--measure-prose);
    margin: 0 0 var(--space-6);
  }

  /* the one accented card on the page: a 2px copper top rule, never a
     coloured left border */
  .rc-value {
    background: var(--surface-card);
    border: var(--border-default);
    border-top: 2px solid var(--copper-600);
    border-radius: var(--radius-none);
    padding: var(--space-4);
    margin: 0 0 var(--space-6);
  }

  .rc-section {
    font-family: var(--font-serif);
    font-weight: var(--weight-regular);
    font-size: var(--size-display-3);
    line-height: var(--lh-display);
    letter-spacing: var(--track-display);
    color: var(--text-display);
    margin: var(--space-6) 0 var(--space-3);
    padding-bottom: var(--space-2);
    border-bottom: var(--border-default);
  }

  table.rc-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: var(--space-3);
  }

  table.rc-table th {
    text-align: left;
    font-family: var(--font-mono);
    font-size: var(--size-mono-xs);
    font-weight: var(--weight-medium);
    letter-spacing: var(--track-label);
    text-transform: uppercase;
    color: var(--text-muted);
    padding: var(--space-2);
    border-bottom: var(--border-default);
  }

  table.rc-table td {
    font-family: var(--font-mono);
    font-size: var(--size-prose-sm);
    line-height: var(--lh-prose);
    color: var(--text-body);
    padding: var(--space-2);
    border-bottom: var(--border-hairline);
    vertical-align: top;
  }

  /* rates are figures, and figures attest — mono */
  td.rc-rate {
    font-family: var(--font-mono);
    font-size: var(--size-mono);
    letter-spacing: 1px;
    color: var(--copper-700);
    white-space: nowrap;
  }

  .rc-note {
    font-family: var(--font-mono);
    font-size: var(--size-prose-sm);
    line-height: var(--lh-prose);
    color: var(--text-body);
    max-width: var(--measure-prose);
    margin-bottom: var(--space-4);
  }

  ul.rc-src {
    list-style: none;
    margin: 0 0 var(--space-5);
    padding: 0;
  }

  ul.rc-src li {
    font-family: var(--font-mono);
    font-size: var(--size-mono-sm);
    line-height: var(--lh-mono);
    color: var(--text-muted);
    padding: 4px 0 4px 18px;
    position: relative;
  }

  ul.rc-src li::before {
    content: "4";
    position: absolute;
    left: 0;
    color: var(--copper-600);
  }

  .rc-foot {
    font-family: var(--font-mono);
    font-size: var(--size-mono-sm);
    letter-spacing: 1px;
    color: var(--text-muted);
    border-top: var(--border-default);
    padding-top: var(--space-3);
    margin-top: var(--space-4);
  }

  /* Fallbacks for any decrypted markup that carries no rc-* class */
  #rc h1, #rc h2, #rc h3, #rc h4 {
    font-family: var(--font-serif);
    font-weight: var(--weight-regular);
    letter-spacing: var(--track-display);
    color: var(--text-display);
  }
  #rc p, #rc li {
    font-family: var(--font-mono);
    font-size: var(--size-prose-sm);
    line-height: var(--lh-prose);
    color: var(--text-body);
  }
  #rc strong { font-weight: var(--weight-semibold); color: var(--text-display); }
  #rc table { border-collapse: collapse; width: 100%; }
  #rc a { color: var(--accent); }
  #rc * { border-radius: var(--radius-none) !important; box-shadow: none !important; }

  @media (max-width: 599.98px) {
    #rc-wrap { padding-left: 32px; padding-right: 20px; }
    .rc-title { font-size: var(--size-display-2); }
    td.rc-rate { white-space: normal; }
  }

  .scroll-x { overflow-x: auto; }
</style>
</head>
<body>
  <div class="doc">
    <main>

      <div class="rail" aria-hidden="true">
        <div class="rail-nums"></div>
        <span class="rail-rule rail-rule--a"></span>
        <span class="rail-rule rail-rule--b"></span>
      </div>

      <section class="card" id="gate">
        <div class="card-body">
          <span class="eyebrow eyebrow--accent">Confidential</span>
          <h1 class="display-3">Engagement &amp; Rates</h1>
          <p class="prose-sm">Enter the access passphrase to view current engagement rates.</p>
          <div class="field">
            <label class="vh" for="pw">Passphrase</label>
            <input id="pw" class="input" type="password" placeholder="Passphrase" autocomplete="off" autofocus />
          </div>
          <button id="go" class="btn btn--primary" type="button">Unlock</button>
          <div id="err" role="status" aria-live="polite"></div>
        </div>
      </section>

      <div id="rc-wrap"><div id="rc" class="scroll-x"></div></div>

    </main>
  </div>

  function b64(s){ var bin = atob(s), u = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++){ u[i]=bin.charCodeAt(i);} return u; }
  async function unlock(pw){
    var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256" }, km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    var buf = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
    return new TextDecoder().decode(buf);
  }
  function attempt(){
    var pw = document.getElementById("pw").value;
    var err = document.getElementById("err");
    if(!pw){ return; }
    err.textContent = "Decrypting...";
    unlock(pw).then(function(html){
      document.getElementById("rc").innerHTML = html;
      document.getElementById("gate").style.display = "none";
      document.getElementById("rc").style.display = "block";
      document.title = "Engagement & Rates";
      window.scrollTo(0,0);
    }).catch(function(){
      err.textContent = "Incorrect passphrase.";
      document.getElementById("pw").value = "";
      document.getElementById("pw").focus();
    });
  }
  document.getElementById("go").addEventListener("click", attempt);
  document.getElementById("pw").addEventListener("keydown", function(e){ if(e.key === "Enter"){ attempt(); } });
